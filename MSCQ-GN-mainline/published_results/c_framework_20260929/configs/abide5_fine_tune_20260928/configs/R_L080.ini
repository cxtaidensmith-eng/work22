grad_clip = 1.0
n_seeds = 1
mixup_alpha = 0.0
gate_sparsity_lambda = 0.0
aux_loss_weight = 1.0
graph_weight_decay = 0.0

[Scheduler]
Use_scheduler = True
T_max = 1000
Lr_Min = 0.0001

[SAVE]
SAVE_GAPH = False

