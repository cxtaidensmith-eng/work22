# Reproduce with abide5_fine_tune.py: Config_ ignores graph_weight_decay.
[DataSet]
DATA_SET = ABIDE-5
Task = ADS_CN
Shuffle = True
train_size = 0

[Hyper_Opt]
Cuda_id = 0
seed = 0

[Modal]
Drop_rate = 0.64
ChebGCN_K = 3
Hidden_size = 96
num_layers = 5
num_heads = 4
input_noise_std = 0.15
drop_path = 0.10
global_word_emb = 64
semantic_branch = both
modal_structure = modal
adj_mode = learned

[Optim]
epochs = 1000
lr = 0.0048
weight_decay = 0.0007
