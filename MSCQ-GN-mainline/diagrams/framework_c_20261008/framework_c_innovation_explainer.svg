   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="460.8" y="34.138594" transform="rotate(-0 460.8 34.138594)">框架 C：关系从哪里来，内容如何传播？</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #677684" x="460.8" y="59.602383" transform="rotate(-0 460.8 59.602383)">先保留模态身份进行患者间传播，再进行模态融合</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="82.8" y="149.570859" transform="rotate(-0 82.8 149.570859)">多模态输入</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #677684" x="82.8" y="176.824688" transform="rotate(-0 82.8 176.824688)">MRI / PET / …</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="268.2" y="108.255469" transform="rotate(-0 268.2 108.255469)">模态关系图</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #677684" x="268.2" y="127.006992" transform="rotate(-0 268.2 127.006992)">用什么找邻居？</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #677684" x="268.2" y="144.011602" transform="rotate(-0 268.2 144.011602)">MRI 图 / PET 图 / …</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="268.2" y="198.255469" transform="rotate(-0 268.2 198.255469)">模态内容编码</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #677684" x="268.2" y="217.006992" transform="rotate(-0 268.2 217.006992)">从邻居传什么？</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #677684" x="268.2" y="234.011602" transform="rotate(-0 268.2 234.011602)">MRI 表示 / PET 表示 / …</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #137f86" x="556.2" y="109.250859" transform="rotate(-0 556.2 109.250859)">① 关系来源与内容分开</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="556.2" y="133.624687" transform="rotate(-0 556.2 133.624687)">每种内容利用多种关系图</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #137f86" x="556.2" y="178.370859" transform="rotate(-0 556.2 178.370859)">② 按内容调整传播方式</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="556.2" y="204.629297" transform="rotate(-0 556.2 204.629297)">边权结合关系先验与内容相似性</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="556.2" y="224.069297" transform="rotate(-0 556.2 224.069297)">发送／接收变换按内容模态区分</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #677684" x="556.2" y="251.291602" transform="rotate(-0 556.2 251.291602)">分别传播 → 关系平均 → 残差更新</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #203040" x="824.4" y="176.824688" transform="rotate(-0 824.4 176.824688)">模态融合与类别读取</text>
